owners:
  - role: Solution Architect
    responsibility: Owns architectural coherence and trade-off documentation.
  - role: Tech Lead
    responsibility: Owns implementation feasibility and component design.
  - role: DBA / Data specialist
    responsibility: Reviews DynamoDB access patterns and lifecycle decisions.
  - role: Security
    responsibility: Reviews threat model, auth, secrets, IAM and logging controls.
  - role: Platform / SRE
    responsibility: Reviews deployment, scaling, SLOs, alerts and operability.
