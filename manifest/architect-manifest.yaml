    title: Events use at-least-once delivery assumptions
    path: docs/architecture/10-consistency-and-idempotency.md
    related: [ADR-0003, ADR-0004]
  - id: CONSTRAINT-NO-PAYMENTS
    title: Payments are out of scope
    path: docs/architecture/02-scope-and-constraints.md
