openQuestions:
  - id: OPEN-001
    question: What is the real notification provider rate limit per environment?
    ownerRole: Platform / SRE
    blocking: false
    targetResolutionStage: Before load test
    path: docs/architecture/19-risks-and-open-questions.md
  - id: OPEN-002
    question: What retention period is required for completed orders?
    ownerRole: Product / Business
    blocking: false
    targetResolutionStage: Before production design
    path: docs/architecture/19-risks-and-open-questions.md
risks:
  - id: RISK-001
    description: Catalog latency dominates create order latency.
    impact: Medium
    likelihood: Medium
    mitigation: Timeout, bounded retry and catalog SLO review.
    ownerRole: Tech Lead
    related: CMP-ORDER-API
    path: docs/architecture/19-risks-and-open-questions.md
  - id: RISK-002
    description: Notification provider throttling causes DLQ growth.
    impact: Medium operational impact
    likelihood: Medium
    mitigation: Rate-aware scaling, DLQ alarm and replay process.
    ownerRole: Platform / SRE
    related: CMP-NOTIFICATION-WORKER
    path: docs/architecture/19-risks-and-open-questions.md
  - id: RISK-003
    description: Future query needs require new DynamoDB access patterns.
    impact: Medium
    likelihood: Medium
    mitigation: No speculative GSIs; add ADR when required.
    ownerRole: DBA / Data specialist
    related: DATA-ORDERS
    path: docs/architecture/19-risks-and-open-questions.md
implementationConstraints:
  - id: CONSTRAINT-AWS-REFERENCE
